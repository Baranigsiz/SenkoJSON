name: CoreJSON CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.cxx }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++-12
            c_compiler: gcc-12
            cxx_compiler: g++-12
          - os: ubuntu-latest
            cxx: clang++-16
            c_compiler: clang-16
            cxx_compiler: clang++-16
          - os: windows-latest
            cxx: msvc
            c_compiler: cl
            cxx_compiler: cl
          - os: macos-latest
            cxx: apple-clang
            c_compiler: clang
            cxx_compiler: clang++

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DCOREJSON_BUILD_TESTS=ON
        -DCOREJSON_BUILD_BENCHMARKS=ON
        -DCOREJSON_BUILD_EXAMPLES=ON
      env:
        CC: ${{ matrix.c_compiler }}
        CXX: ${{ matrix.cxx_compiler }}

    - name: Build All Targets
      run: cmake --build build --config Release

    - name: Run Unit Tests
      run: ctest --test-dir build --output-on-failure -C Release

    - name: Run Benchmarks
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          ./build/Release/corejson_benchmarks.exe || ./build/corejson_benchmarks.exe
        else
          ./build/corejson_benchmarks
        fi
      shell: bash

    - name: Verify Single Header Generation
      run: |
        python scripts/amalgamate.py
        git diff --exit-code single_include/corejson/corejson.hpp || (echo "Single header is out of date! Run scripts/amalgamate.py" && exit 1)
      shell: bash
