name: CoreJSON CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu (GCC 12)"
            os: ubuntu-latest
            cc: gcc-12
            cxx: g++-12
          - name: "Ubuntu (Clang 16)"
            os: ubuntu-latest
            cc: clang-16
            cxx: clang++-16
          - name: "macOS (Apple Clang)"
            os: macos-latest
            cc: clang
            cxx: clang++
          - name: "Windows (MSVC 2022)"
            os: windows-latest
            cc: ""
            cxx: ""

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure CMake (Linux / macOS)
      if: runner.os != 'Windows'
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DCOREJSON_BUILD_TESTS=ON
        -DCOREJSON_BUILD_BENCHMARKS=ON
        -DCOREJSON_BUILD_EXAMPLES=ON
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}

    - name: Configure CMake (Windows MSVC)
      if: runner.os == 'Windows'
      run: >
        cmake -B build
        -DCOREJSON_BUILD_TESTS=ON
        -DCOREJSON_BUILD_BENCHMARKS=ON
        -DCOREJSON_BUILD_EXAMPLES=ON

    - name: Build All Targets
      run: cmake --build build --config Release

    - name: Run Unit Tests
      run: ctest --test-dir build --output-on-failure -C Release

    - name: Run Benchmarks
      shell: bash
      run: |
        if [ -f "./build/Release/corejson_benchmarks.exe" ]; then
          ./build/Release/corejson_benchmarks.exe
        elif [ -f "./build/corejson_benchmarks.exe" ]; then
          ./build/corejson_benchmarks.exe
        else
          ./build/corejson_benchmarks
        fi

    - name: Verify Single Header Amalgamation
      shell: bash
      run: |
        python scripts/amalgamate.py
        git config core.autocrlf false
        git diff --ignore-space-at-eol --exit-code single_include/corejson/corejson.hpp || (echo "Single header out of date! Run scripts/amalgamate.py" && exit 1)
